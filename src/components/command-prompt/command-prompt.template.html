<template id="command-prompt-template">
    <section id="command-prompt-wrapper" class="prompt">
        <div id="command-prompt-frame-box" class="frame-box">
            <label id="command-prompt-root" class="prompt-line">
                <span class="marker">&gt;</span>
                <textarea id="command-prompt-input" spellcheck="false" rows="1" aria-label="MathJSLab prompt"></textarea>
            </label>
            <div id="command-prompt-output" class="output" aria-live="polite"></div>
        </div>
    </section>
</template>
