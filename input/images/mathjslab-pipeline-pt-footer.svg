         stroke-linecap="round"
         stroke-linejoin="round"
         id="path20" /></symbol></defs><style
     id="style25">
    .ui { font-family: &quot;Segoe UI&quot;, Arial, sans-serif; }
    .mono { font-family: &quot;Cascadia Mono&quot;, Consolas, &quot;DejaVu Sans Mono&quot;, monospace; }
    .panel { fill: #ffffff; stroke-width: 2; }
    .panel-title { font-size: 26px; font-weight: 700; }
    .step-number { fill: #ffffff; font-size: 27px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
    .node-title { font-size: 18px; font-weight: 700; text-anchor: middle; }
    .node-sub { font-size: 17px; font-weight: 600; text-anchor: middle; }
    .footer-text { fill: #0b1733; font-size: 17px; }
    .grammar-key { fill: #0b4acb; font-weight: 700; }
    .grammar-text { fill: #101820; }
    .stack-text { fill: #171923; font-size: 13px; }
    .small-label { font-size: 15px; fill: #1a2232; }
  </style><!-- CABEÇALHO --><!-- SETAS PRINCIPAIS --><!-- PAINEL 1: GRAMÁTICA --><!-- PAINEL 2: CÓDIGO EXEMPLO --><!-- PAINEL 3: AST --><!-- PAINEL 4: EVALUATOR --><!-- RODAPÉ EXPLICATIVO --><style
     id="style1">
.fill-symbol {
  fill: hsl(120, 52%, 16%);
}

.stroke-fill-panel {
  stroke: hsl(120, 100%, 25%);
  fill: hsl(120, 52%, 88%);
}

.stroke-trace {
  fill: none;
  stroke: hsl(0, 0%, 24%);
}

.fill-trace {
  fill: hsl(0, 0%, 24%);
}

@media (prefers-color-scheme: dark) {
  .fill-symbol {
    fill: hsl(120, 52%, 88%);
  }
  .stroke-fill-panel {
    stroke: hsl(120, 100%, 25%);
    fill: hsl(120, 52%, 16%);
  }
  .stroke-trace {
    stroke: hsl(0, 0%, 92%);
  }
  .fill-trace {
    fill: hsl(0, 0%, 92%);
  }
}
